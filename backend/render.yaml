# Render Blueprint for Claritas Verify OTP Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: claritas-verify-api
    env: python
    region: singapore  # Choose closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_EMAIL
        sync: false  # Will prompt for value during deploy
      - key: SMTP_PASSWORD
        sync: false  # Will prompt for value during deploy
      - key: SENDER_NAME
        value: Claritas Verify
      - key: FRONTEND_URL
        sync: false  # Set to your Netlify URL
